
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="auto">
    <meta name="color-scheme" content="light dark">
    <title>Inicio | Galería, reloj y clima</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="main-container">

        <!-- BUSCADOR -->
        <section class="search-container">
            <form id="searchForm">
                <input
                    type="search"
                    id="searchInput"
                    placeholder="Buscar en Google..."
                    autocomplete="off"
                    aria-label="Buscar en Google"
                >
                <button type="submit" class="search-button" aria-label="Buscar en Google">
                    <svg viewBox="0 0 24 24">
                        <circle cx="10.8" cy="10.8" r="7.2"></circle>
                        <path d="m16 16 5 5"></path>
                    </svg>
                </button>
            </form>
        </section>

        <!-- GALERÍA AUTOMÁTICA -->
        <section class="gallery-card">
            <div class="gallery-header">
                <label
                    class="icon-button upload-button"
                for="imageUpload"
                title="Agregar fotografías"
                aria-label="Agregar fotografías">
                    <svg viewBox="0 0 24 24">
                        <path d="M12 5v14"></path>
                        <path d="M5 12h14"></path>
                    </svg>
                </label>

                <input
                    type="file"
                    id="imageUpload"
                    accept="image/jpeg,image/png,image/webp"
                    multiple
                    hidden
                >

                <span class="gallery-limit">"≤" 10</span>
            </div>

            <div class="gallery-slider" id="slides">
                <div class="empty-gallery">
                    <div class="empty-icon">＋</div>
                    <p>Tu galería está lista</p>
                    <span>Agrega fotografías para iniciar</span>
                </div>
            </div>

            <button type="button" class="slider-arrow prev" id="prevSlide"
                    aria-label="Fotografía anterior" hidden>
                <svg viewBox="0 0 24 24">
                    <path d="m15 18-6-6 6-6"></path>
                </svg>
            </button>

            <button type="button" class="slider-arrow next" id="nextSlide"
                    aria-label="Fotografía siguiente" hidden>
                <svg viewBox="0 0 24 24">
                    <path d="m9 18 6-6-6-6"></path>
                </svg>
            </button>

            <div class="slide-counter" id="slideCounter" hidden>1/10</div>

            <div class="gallery-footer">
                <div class="slider-dots" id="sliderDots"></div>
                <div class="upload-status" id="uploadStatus"></div>
            </div>
        </section>

        <!-- RELOJ -->
        <section class="clock-card">
            <div class="clock-location" id="city">Detectando ubicación...</div>
            <div class="clock-time" id="time">--:--:--</div>
            <div class="clock-date" id="date">Cargando fecha...</div>
        </section>

        <!-- CLIMA COMPACTO -->
        <section class="weather-card" id="weatherCard">
            <div class="weather-top">
                <div class="weather-title">
                    <span class="weather-title-icon">🌤️</span>
                    <div>
                        <h2>Clima</h2>
                        <div class="weather-location" id="weatherLocation">
                            Detectando ubicación...
                        </div>
                    </div>
                </div>

                <button type="button" id="refreshWeather" class="refresh-button"
                        title="Actualizar clima" aria-label="Actualizar clima">
                    <svg viewBox="0 0 24 24">
                        <path d="M20 7v5h-5"></path>
                        <path d="M4 17v-5h5"></path>
                        <path d="M5.6 9a7 7 0 0 1 11.7-2L20 12"></path>
                        <path d="M18.4 15a7 7 0 0 1-11.7 2L4 12"></path>
                    </svg>
                </button>
            </div>

            <div id="weatherCurrent" class="weather-current">
                <div class="weather-loading">Consultando el clima...</div>
            </div>

            <div class="forecast-heading">PRÓXIMOS DÍAS</div>
            <div id="forecastList" class="forecast-list">
                <div class="weather-loading">Cargando...</div>
            </div>

            <div class="weather-note" id="weatherNote">
                Datos meteorológicos de Open-Meteo
            </div>
        </section>

        <footer class="page-footer">
            <span>Miguel Montes & AI</span>
            <span id="themeLabel">Tema automático</span>
        </footer>

    </main>

    <script src="script.js"></script>
</body>
</html>
